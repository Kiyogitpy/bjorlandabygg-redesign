<body data-doc="doc.contact">
<a class="skip" href="#main" data-i18n="skip">Hoppa till innehållet</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="assets/img/logo.png" width="250" height="150" alt="Björlanda Bygg AB"></a>
    <nav class="nav" data-i18n-aria="nav.label" aria-label="Huvudmeny">
      <a href="index.html" data-i18n="nav.home" >Hem</a>
      <a href="kontakt.html" data-i18n="nav.contact" aria-current="page">Kontakt</a>
    </nav>
    <div class="lang" role="group" aria-label="Språk / Language">
      <button type="button" data-lang="sv" aria-pressed="true">SV</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a class="tel" href="tel:+46708929494" data-i18n="tel.label">Ring 0708-92 94 94</a>
  </div>
</header>
<main id="main">
  <section class="page-head">
    <div class="wrap">
      <h1 data-i18n="c.h1">Kontakt</h1>
      <p style="margin-top:1rem;font-size:1.3rem;color:var(--muted)" data-i18n="c.lead">Kontakta oss:</p>
    </div>
  </section>
  <section class="contact">
    <div class="wrap">
      <form id="contact-form" novalidate>
        <label><span data-i18n="f.name">Namn *</span><input name="name" autocomplete="name" required></label>
        <label><span data-i18n="f.tel">Telefon *</span><input name="tel" type="tel" autocomplete="tel" required></label>
        <label><span data-i18n="f.mail">E-post *</span><input name="email" type="email" autocomplete="email" required></label>
        <label><span data-i18n="f.msg">Meddelande *</span><textarea name="message" required></textarea></label>
        <div><button class="btn btn-primary" type="submit"><span data-i18n="f.send">Skicka</span> <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></button></div>
        <p class="status" id="form-status" role="status" aria-live="polite"></p>
      </form>
      <aside class="card-address">
        <h2 data-i18n="c.card">Björlanda Bygg AB</h2>
        <address>Friluftsvägen 2A<br>423 63 Torslanda<br><br>Patrik Pettersson</address>
        <div class="row"><span class="k" data-i18n="c.tel">Tel:</span><a href="tel:+46708929494">0708-92 94 94</a></div>
        <div class="row"><span class="k" data-i18n="c.mail">Mail:</span><a href="mailto:patrik@bjorlandabygg.se">patrik@bjorlandabygg.se</a></div>
      </aside>
    </div>
  </section>
</main>
<footer class="site-footer">
  <div class="wrap">
    <span data-i18n="foot.copy">© 2015 Björlanda Bygg AB</span>
    <span>Friluftsvägen 2A, 423 63 Torslanda · <a href="tel:+46708929494">0708-92 94 94</a></span>
    <a class="ig" href="https://www.instagram.com/bjorlandabygg/" target="_blank" rel="noopener" aria-label="Instagram: @bjorlandabygg"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg></a>
  </div>
</footer>
